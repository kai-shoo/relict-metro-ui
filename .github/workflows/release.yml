name: Release

on:
  push:
    tags:
      - 'v[0-9]*'
      - '[0-9]*'

permissions:
  contents: read

jobs:
  verify:
    name: Verify release candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    if: ${{ !github.event.deleted }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: npm

      - run: node scripts/verify-release-tag.mjs
      - run: npm ci
      - run: npm run typecheck
      - run: npx playwright install --with-deps --no-shell chromium
      - name: Use full Chromium in headless mode
        run: |
          chromium_path="$(node --input-type=module -e 'import { chromium } from "playwright"; console.log(chromium.executablePath())')"
          test -x "$chromium_path"
          echo "METRO_CHROMIUM_PATH=$chromium_path" >> "$GITHUB_ENV"
          "$chromium_path" --version
      - name: Match the visual test fonts
        run: |
          archive="$RUNNER_TEMP/JetBrainsMono.tar.xz"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/ryanoasis/nerd-fonts/releases/download/v3.5.1/JetBrainsMono.tar.xz \
            --output "$archive"
          echo "04d5e8f903693f9dd13e16f867e994834e681eb3c72c0d337a770dcda09010cf  $archive" | sha256sum --check
          font_dir="$HOME/.local/share/fonts"
          mkdir -p "$font_dir"
          tar -xJf "$archive" -C "$font_dir" --wildcards 'JetBrainsMonoNerdFont-*.ttf'
          export FONTCONFIG_FILE="$GITHUB_WORKSPACE/.github/ci-fonts.conf"
          fc-cache "$font_dir"
          test "$(fc-match -f '%{family}' system-ui)" = 'Liberation Sans'
          test "$(fc-match -f '%{family}' monospace | cut -d, -f1)" = 'JetBrainsMono Nerd Font'
          echo "FONTCONFIG_FILE=$FONTCONFIG_FILE" >> "$GITHUB_ENV"
      - name: Run browser tests
        run: npm test
      - name: Pack and verify the candidate archive
        id: candidate
        shell: bash
        run: |
          archive_dir="$(mktemp -d "$RUNNER_TEMP/release-candidate.XXXXXX")"
          filename="$(npm pack --ignore-scripts --loglevel=error --pack-destination "$archive_dir")"
          archive="$archive_dir/$filename"
          node scripts/verify-package.mjs "$archive"
          echo "path=$archive" >> "$GITHUB_OUTPUT"
      - name: Upload the verified archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate
          path: ${{ steps.candidate.outputs.path }}
          if-no-files-found: error
