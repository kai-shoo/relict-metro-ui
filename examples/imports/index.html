<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0050ef">
    <title>Survey imports</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./styles.css">
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <main>
      <a href="../start/">Start</a>
      <h1>Survey imports</h1>
      <p id="system">Preparing the share target…</p>
      <metro-file-picker id="picker" label="Import a local file" context-key="survey-import"
        choose-label="Choose files" accept=".txt,.md,text/plain,text/markdown" multiple></metro-file-picker>
      <p id="message" role="status"></p>

      <section aria-labelledby="waiting-heading">
        <h2 id="waiting-heading" tabindex="-1">Waiting for review</h2>
        <p id="empty-pending">No imports are waiting.</p>
        <ul id="pending"></ul>
      </section>

      <section id="preview" aria-labelledby="preview-heading" hidden>
        <h2 id="preview-heading" tabindex="-1">Review import</h2>
        <p id="source"></p>
        <p id="note" hidden></p>
        <p id="address" hidden></p>
        <div id="files"></div>
        <form id="acknowledge" class="actions">
          <label>Destination <select id="destination" required></select></label>
          <button id="accept" type="submit">Import</button>
          <button id="later" type="button">Keep for later</button>
        </form>
      </section>

      <section aria-labelledby="imported-heading">
        <h2 id="imported-heading" tabindex="-1">Imported</h2>
        <p id="empty-imported">No items have been imported.</p>
        <div id="imports"></div>
      </section>
    </main>
  </body>
</html>
