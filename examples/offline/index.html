<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>For offline use</title>
    <link rel="stylesheet" href="./offline.css">
    <script type="module" src="./offline.js"></script>
  </head>
  <body>
    <main>
      <a href="../collections/">Collections</a>
      <h1 id="title" tabindex="-1">For offline use</h1>
      <p id="availability" role="status"></p>
      <metro-command-bar id="commands" label="File commands"></metro-command-bar>
      <p id="selection-count" role="status">0 selected</p>
      <p id="transfer-result" role="status"></p>
      <div id="groups"></div>
    </main>
    <template id="group-template">
      <section class="group">
        <h2><metro-checkbox class="group-choice"></metro-checkbox></h2>
        <div class="group-transfer" hidden>
          <metro-transfer-control hide-cancel></metro-transfer-control>
        </div>
        <ul role="list"></ul>
      </section>
    </template>
    <metro-dialog id="file-preview" label="Saved file">
      <pre id="file-content"></pre>
      <button type="button" slot="actions" data-metro-value="close">Close file</button>
    </metro-dialog>
  </body>
</html>
